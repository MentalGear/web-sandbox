<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>strict-mode probes host</title>
</head>
<body>
<script>
// The host page of the strict-mode probes (research 15). It plays the library's host role only:
// it inserts the wrapper frame (or, for positive controls, the view directly), posts INIT_VIEW with
// the two ports, and records everything that reaches it. The spec builds every document in Node.
window.inbox = [];          // messages on the logic port (host <-> worker) and the view port (host <-> view)
window.windowMessages = []; // anything posted to the host window itself: must stay empty
addEventListener('message', (event) => {
    let data;
    try { data = JSON.parse(JSON.stringify(event.data)); } catch { data = String(event.data); }
    window.windowMessages.push({ origin: event.origin, data });
});

window.mount = (options) => new Promise((resolve) => {
    // options: { srcdoc, sandbox }
    const frame = document.createElement('iframe');
    frame.id = 'outer'; frame.name = 'outer';
    frame.setAttribute('sandbox', options.sandbox);
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.style.cssText = 'width:600px;height:400px;border:0';
    frame.onload = () => resolve(true);
    frame.srcdoc = options.srcdoc; // before insertion, as the library does (host.ts)
    document.body.appendChild(frame);
});

// view window: frames[0] of the wrapper, or the frame itself when mounted without the wrapper
window.viewWindow = (wrapped) => {
    const frame = document.getElementById('outer');
    return wrapped ? frame.contentWindow.frames[0] : frame.contentWindow;
};

window.init = (wrapped, workerSource, opts) => {
    const logic = new MessageChannel();
    const view = new MessageChannel();
    logic.port1.onmessage = (e) => window.inbox.push({ port: 'logic', data: e.data });
    view.port1.onmessage = (e) => window.inbox.push({ port: 'view', data: e.data });
    window.logicPort = logic.port1;
    window.viewWindow(wrapped).postMessage({ type: 'INIT_VIEW', workerSource, opts }, '*', [logic.port2, view.port2]);
};

// round trip host -> worker -> host over the logic port, or 'no-pong' after `timeout` ms
window.ping = (timeout) => new Promise((resolve) => {
    const n = Math.random();
    const started = performance.now();
    const listener = (e) => {
        if (e.data && e.data.type === 'PONG' && e.data.n === n) {
            window.logicPort.removeEventListener('message', listener);
            resolve(performance.now() - started);
        }
    };
    window.logicPort.addEventListener('message', listener);
    window.logicPort.postMessage({ type: 'PING', n });
    setTimeout(() => resolve('no-pong'), timeout);
});
</script>
</body>
</html>
