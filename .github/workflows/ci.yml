name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # a fixed image, not ubuntu-latest: Playwright installs its browsers only on the releases of Ubuntu it supports (26.04
    # from 1.64, so the pinned 1.65.1 does), and a moving image would turn every e2e job red the day it moves to a release
    # the pinned Playwright does not support
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Both builds of the package (ADR-009) in one run: a test file's build is its imports. A file that tests a network
      # mode imports the network build's entry; every other file's element is the default build's (sealed mode alone),
      # and test/unit/default-build.test.ts holds that build to its modules, in the module graph and in the bundle.
      - run: bun run test:unit
      - run: bun run build
      # each build's public API against its reviewed report (etc/web-sandbox.api.md, the default build; etc/web-sandbox.network.api.md,
      # the build with the network modes), and the checked-in doc models against the builds (bun run api:update accepts a change)
      - run: bun run api:check
      # the generated regions and the markers of the handwritten sections against the code; the API reference is read from the checked-in doc models, so this needs no build (bun run docs:gen, docs:gen --accept)
      - run: bun run docs:check
      # packs, installs and type-checks each build: the network build, then the default one (the package as published)
      - run: ./scripts/smoke-package.sh

  e2e:
    runs-on: ubuntu-26.04
    # a run takes about 25 minutes; a stuck one ends here instead of at GitHub's 6 hours, with its log
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      # A run's inputs are the checkout's files, but the Markdown ones: no page, spec or probe reads one (the unit job
      # checks the docs). The suite's result on an engine is keyed by their hash (backlog T10): a key that has passed is
      # not run again, so a commit that changes only docs runs no browser. The marker is written after the last test
      # step and saved only by a job that succeeded, so a failed or cancelled run leaves no key behind.
      - id: inputs
        run: echo "hash=$(git ls-files -z -- . ':(exclude)*.md' | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: passed
        uses: actions/cache@v4
        with:
          path: .e2e-passed
          key: e2e-passed-${{ matrix.browser }}-${{ steps.inputs.outputs.hash }}
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.passed.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - if: steps.passed.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      # Both builds in one run, each test once (ADR-009): a test names its build (test.use({ build }); the default is the
      # default build), the server serves both entries and both bundles (dist/, dist-network/), and a page refuses a
      # config that is the other build's to test, so no spec passes against the wrong build.
      - if: steps.passed.outputs.cache-hit != 'true'
        run: bunx playwright test --project=${{ matrix.browser }}
      # the strict-mode design probes (research 15) that ADR-005 rests on; skipped under the root config above
      - if: steps.passed.outputs.cache-hit != 'true'
        run: bun run test:probes --project=${{ matrix.browser }}
      - if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p .e2e-passed && git rev-parse HEAD > .e2e-passed/commit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
