<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sandbox e2e harness</title>
    <!--
        Minimal host page for the e2e and research specs (see test/e2e/fixture.ts).
        Kept separate from the playground so a playground change cannot break the security suite.
    -->
    <script type="module">
        import { defineWebSandbox } from '/src/host.ts';

        defineWebSandbox();

        window.sandboxLogs = [];
        window.addEventListener('sandbox-log', (event) => {
            const args = event.detail?.args || [];
            window.sandboxLogs.push(args.map(String).join(' '));
        });
        window.harnessReady = true;
    </script>
    <style>web-sandbox { display: block; width: 400px; height: 300px; }</style>
</head>
<body>
    <web-sandbox></web-sandbox>
</body>
</html>
